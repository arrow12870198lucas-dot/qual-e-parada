name: Gerar APK RotaX v1.8.3

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Baixar arquivos do repositório
        uses: actions/checkout@v4

      - name: Extrair projeto RotaX v1.8.3
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$GITHUB_WORKSPACE/RotaX-v1.8.3-projeto-androidx.zip"
          if [ ! -f "$ZIP" ]; then
            echo "ERRO: não encontrei RotaX-v1.8.3-projeto-androidx.zip na raiz do repositório."
            echo "Arquivos ZIP encontrados:"
            find "$GITHUB_WORKSPACE" -maxdepth 2 -type f -iname '*.zip' -print || true
            exit 1
          fi
          rm -rf /tmp/rotax-source
          mkdir -p /tmp/rotax-source
          unzip -q "$ZIP" -d /tmp/rotax-source
          ROOT="$(find /tmp/rotax-source -type f -name settings.gradle -printf '%h\n' | head -n 1)"
          if [ -z "$ROOT" ]; then
            echo "ERRO: não encontrei settings.gradle dentro do ZIP."
            exit 1
          fi
          cp -a "$ROOT"/. "$GITHUB_WORKSPACE"/
          test -f gradle.properties
          grep -q '^android.useAndroidX=true$' gradle.properties
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/assets/index.html
          echo "Projeto RotaX v1.8.3 extraído; AndroidX habilitado."

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar APK
        run: gradle clean assembleDebug

      - name: Preparar APK para download
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          cp "$APK" app/build/outputs/apk/debug/RotaX-v1.8.3.apk

      - name: Disponibilizar APK RotaX v1.8.3
        uses: actions/upload-artifact@v4
        with:
          name: RotaX-v1.8.3-APK
          path: app/build/outputs/apk/debug/RotaX-v1.8.3.apk
          if-no-files-found: error
          retention-days: 14
